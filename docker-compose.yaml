version: "3.8"
name: nextcloud-aio # Add the container to the same compose project like all the sibling containers are added to automatically.

services:
  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:20261021_180331
    init: true
    container_name: nextcloud-aio-mastercontainer
    restart: always
    # network_mode: bridge
    networks:
      - default
    ports:
      - "8081:8080"
    environment:
      - APACHE_PORT=${APACHE_PORT:-11000}
      - SKIP_DOMAIN_VALIDATION=false
      - NEXTCLOUD_MEMORY_LIMIT=${NEXTCLOUD_MEMORY_LIMIT:-6144M}
      - NEXTCLOUD_ENABLE_DRI_DEVICE=true
      - NEXTCLOUD_DATADIR=${NEXTCLOUD_DATADIR:-/mnt/nextcloud-data}
#      - NEXTCLOUD_MOUNT=/mnt/

    volumes:
      - 'nextcloud_aio_mastercontainer:/mnt/docker-aio-config'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

networks: 
  default: 
    name: nextcloud-aio
